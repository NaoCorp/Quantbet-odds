name: Actualizar Cuotas QuantBet

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 11:00 AM hora Perú/Colombia (16:00 UTC)
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Obtener cuotas reales
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch_odds.mjs

      - name: Guardar odds.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds.json
          git diff --staged --quiet || (git commit -m "chore: actualizar cuotas reales" && git push)
